<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casiano · Despensa natural y café · Pedidos</title>
<meta name="description" content="Hacé tu pedido a Casiano, despensa natural y café en Italia 2076, Rosario. Envíos en el barrio.">
<meta name="theme-color" content="#2f5d46">
<style>
  :root {
    --verde: #2f5d46; --verde-2: #3f7a5c; --crema: #f7f3ec; --tinta: #1d1d1b; --gris: #6b6b66;
    --borde: #e6e1d8; --acento: #d9822b; --blanco: #fff; --sombra: 0 2px 10px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--crema); color: var(--tinta); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  body { padding-bottom: 96px; }
  button { font: inherit; cursor: pointer; }
  .cab { background: var(--verde); color: #fff; padding: 14px 16px 18px; }
  .cab-fila { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 900px; margin: 0 auto; }
  .marca { font-size: 26px; font-weight: 800; letter-spacing: .5px; }
  .marca small { display: block; font-size: 12px; font-weight: 500; opacity: .85; letter-spacing: 0; }
  .btn-info { background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 20px; padding: 8px 14px; font-size: 13px; }
  .buscador { max-width: 900px; margin: 14px auto 0; position: relative; }
  .buscador input { width: 100%; border: 0; border-radius: 14px; padding: 14px 16px 14px 44px; font-size: 16px; background: #fff; color: var(--tinta); box-shadow: var(--sombra); outline: none; }
  .buscador svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); }
  .chips { position: sticky; top: 0; z-index: 5; background: var(--crema); border-bottom: 1px solid var(--borde); }
  .chips-in { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; max-width: 900px; margin: 0 auto; scrollbar-width: none; }
  .chips-in::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--borde); background: #fff; border-radius: 20px; padding: 8px 14px; font-size: 14px; color: var(--tinta); white-space: nowrap; }
  .chip.activo { background: var(--verde); border-color: var(--verde); color: #fff; }
  main { max-width: 900px; margin: 0 auto; padding: 8px 16px 20px; }
  .aviso { background: #fff; border: 1px solid var(--borde); border-radius: 12px; padding: 10px 14px; font-size: 13px; color: var(--gris); margin: 10px 0 4px; display: flex; gap: 8px; align-items: center; }
  h2.seccion { font-size: 19px; margin: 22px 0 10px; }
  .grilla { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 680px) { .grilla { grid-template-columns: 1fr 1fr; } }
  .prod { display: flex; gap: 12px; background: #fff; border-radius: 14px; padding: 12px; box-shadow: var(--sombra); border: 0; text-align: left; width: 100%; color: inherit; align-items: stretch; }
  .prod .txt { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .prod .nom { font-weight: 600; font-size: 15px; line-height: 1.25; }
  .prod .desc { color: var(--gris); font-size: 13px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .prod .precio { margin-top: auto; padding-top: 8px; font-weight: 700; font-size: 16px; }
  .prod .precio small { font-weight: 500; color: var(--gris); font-size: 12px; }
  .foto { position: relative; width: 96px; height: 96px; flex: none; border-radius: 12px; overflow: hidden; background: #efe9df; display: flex; align-items: center; justify-content: center; font-size: 38px; }
  .foto img { width: 100%; height: 100%; object-fit: cover; }
  .mas { position: absolute; right: 6px; bottom: 6px; width: 30px; height: 30px; border-radius: 50%; background: #fff; color: var(--verde); font-size: 22px; line-height: 28px; text-align: center; font-weight: 700; box-shadow: var(--sombra); }
  .cant-badge { position: absolute; left: 6px; top: 6px; background: var(--verde); color: #fff; border-radius: 10px; font-size: 12px; padding: 2px 7px; font-weight: 700; }
  .prod.sin { opacity: .5; }
  .prod.sin .mas { display: none; }
  .etq-sin { color: #a33; font-size: 12px; font-weight: 600; margin-top: 4px; }
  .etq-ult { color: var(--acento); font-size: 12px; font-weight: 600; margin-top: 4px; }
  .vacio { text-align: center; color: var(--gris); padding: 40px 10px; }
  .barra { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); z-index: 10; pointer-events: none; }
  .barra button { pointer-events: auto; max-width: 868px; margin: 0 auto; display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; background: var(--verde); color: #fff; border: 0; border-radius: 14px; padding: 15px 18px; font-size: 16px; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
  .barra .n { background: rgba(255,255,255,.2); border-radius: 8px; padding: 2px 9px; }
  .velo { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .hoja { background: #fff; width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 0 0 calc(16px + env(safe-area-inset-bottom)); animation: sube .18s ease-out; }
  @media (min-width: 680px) { .velo { align-items: center; } .hoja { border-radius: 20px; } }
    .hoja.quieta { animation: none; }
  @keyframes sube { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
  .hoja-cab { position: sticky; top: 0; background: #fff; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--borde); z-index: 1; }
  .hoja-cab h3 { margin: 0; font-size: 18px; }
  .cerrar { border: 0; background: #f1ede6; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; }
  .det-foto { width: 100%; aspect-ratio: 4/3; background: #efe9df; display: flex; align-items: center; justify-content: center; font-size: 90px; }
  .det-foto img { width: 100%; height: 100%; object-fit: cover; }
  .cuerpo { padding: 14px 16px; }
  .cuerpo p { margin: 6px 0; color: var(--gris); }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--borde); border-radius: 12px; overflow: hidden; }
  .stepper button { border: 0; background: #fff; width: 44px; height: 44px; font-size: 22px; color: var(--verde); }
  .stepper span { min-width: 70px; text-align: center; font-weight: 700; }
  .agregar { width: 100%; margin-top: 14px; background: var(--verde); color: #fff; border: 0; border-radius: 12px; padding: 15px; font-size: 16px; font-weight: 700; display: flex; justify-content: space-between; }
  .item { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--borde); }
  .item .t { flex: 1; min-width: 0; }
  .item .t b { display: block; font-size: 14px; font-weight: 600; }
  .item .t small { color: var(--gris); }
  .item .stepper button { width: 34px; height: 34px; font-size: 18px; }
  .item .stepper span { min-width: 52px; font-size: 14px; }
  .opciones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
  .opcion { border: 2px solid var(--borde); background: #fff; border-radius: 12px; padding: 12px; text-align: left; color: var(--tinta); }
  .opcion b { display: block; } .opcion small { color: var(--gris); }
  .opcion.activo { border-color: var(--verde); background: #eef5f0; }
  label.campo { display: block; font-size: 13px; color: var(--gris); margin-top: 10px; }
  label.campo input, label.campo textarea, label.campo select { display: block; width: 100%; margin-top: 4px; border: 1px solid var(--borde); border-radius: 10px; padding: 12px; font-size: 16px; font-family: inherit; color: var(--tinta); background: #fff; }
  .totales { margin-top: 14px; border-top: 1px solid var(--borde); padding-top: 10px; }
  .totales div { display: flex; justify-content: space-between; margin: 4px 0; }
  .totales .g { font-size: 18px; font-weight: 800; }
  .wa { width: 100%; margin-top: 14px; background: #1f9d55; color: #fff; border: 0; border-radius: 12px; padding: 15px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .nota { font-size: 12px; color: var(--gris); text-align: center; margin-top: 8px; }
  .error { color: #a33; font-size: 13px; margin-top: 8px; }
  .pie { text-align: center; color: var(--gris); font-size: 12px; padding: 10px 16px 0; }
  .contacto a { color: var(--verde); font-weight: 600; }
</style>
</head>
<body>
<header class="cab">
  <div class="cab-fila">
    <div class="marca">Casiano<small>Despensa natural y café · Italia 2076, Rosario</small></div>
    <button class="btn-info" id="btnInfo">Contacto</button>
  </div>
  <div class="buscador">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b6b66" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscá almendras, granola, café…" autocomplete="off" enterkeyhint="search">
  </div>
</header>
<nav class="chips"><div class="chips-in" id="chips"></div></nav>
<main>
  <div class="aviso" id="aviso"></div>
  <div id="lista"></div>
  <p class="pie" id="pie"></p>
</main>
<div class="barra" id="barra" hidden><button id="verPedido"><span class="n" id="barraN">0</span><span>Ver pedido</span><span id="barraT">$ 0</span></button></div>
<div id="capa"></div>

<script>
// El catálogo se pide siempre fresco (sin memoria del navegador), para ver el stock al día.
function cargarCatalogo(listo) {
  const s = document.createElement('script');
  s.src = 'catalogo.js?t=' + Date.now();
  s.onload = () => { s.remove(); listo(); };
  s.onerror = () => { s.remove(); listo(); };
  document.head.appendChild(s);
}
cargarCatalogo(function () {
  const C = window.CATALOGO || { productos: [], negocio: {} };
  const N = Object.assign({ nombre: 'Casiano', whatsapp: '', envio: 0, direccion: '', horarios: '', ciudad: 'Rosario' }, C.negocio || {});
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pesos = (n) => '$ ' + Math.round(n).toLocaleString('es-AR');
  const sinAcento = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const EMOJI = [['aceituna', '🫒'], ['aceite', '🫒'], ['cafe', '☕'], ['te ', '🍵'], ['te', '🍵'], ['yerba', '🧉'], ['fruto', '🥜'], ['mani', '🥜'], ['almendra', '🥜'], ['nuez', '🌰'], ['semilla', '🌻'], ['granola', '🥣'], ['cereal', '🥣'], ['avena', '🥣'], ['barrita', '🍫'], ['chocolate', '🍫'], ['galleta', '🍪'], ['galletita', '🍪'], ['snack', '🍿'], ['yogur', '🥛'], ['leche', '🥛'], ['queso', '🧀'], ['harina', '🌾'], ['premezcla', '🌾'], ['levadura', '🌾'], ['arroz', '🍚'], ['legumbre', '🫘'], ['lenteja', '🫘'], ['fideo', '🍝'], ['pasta', '🍝'], ['aceite', '🫒'], ['mermelada', '🍯'], ['miel', '🍯'], ['salsa', '🥫'], ['especia', '🌿']];
  const emoji = (p) => {
    for (const txt of [p.categoria, p.nombre]) { // primero la categoría, después el nombre
      const s = ' ' + sinAcento(txt).replace(/[^a-z0-9]+/g, ' ');
      const e = EMOJI.find(([k]) => s.includes(' ' + k)); if (e) return e[1];
    }
    return '🛍️';
  };
  const titulo = (s) => { s = String(s || '').trim(); return s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : 'Otros'; };

  // Productos: categorías unificadas sin importar mayúsculas.
  const prods = (C.productos || []).map((p) => ({ ...p, cat: titulo(p.categoria), _q: sinAcento(`${p.nombre} ${p.categoria} ${p.descripcion || ''}`) }));
  const cats = [...new Set(prods.map((p) => p.cat))].sort((a, b) => (a === 'Otros') - (b === 'Otros') || a.localeCompare(b, 'es'));
  const porId = Object.fromEntries(prods.map((p) => [p.id, p]));

  // Carrito (se recuerda en este celular si el navegador lo permite).
  let carrito = {};
  try { carrito = JSON.parse(localStorage.getItem('casiano-carrito') || '{}'); } catch (e) { carrito = {}; }
  const tope = (p) => (typeof p.max === 'number' ? p.max : 99);
  Object.keys(carrito).forEach((id) => { const p = porId[id]; if (!p || !p.hayStock) delete carrito[id]; else carrito[id] = Math.min(carrito[id], tope(p)); });
  let datos = { modo: N.envio > 0 ? 'envio' : 'retiro', nombre: '', direccion: '', pago: 'Efectivo', notas: '' };
  try { Object.assign(datos, JSON.parse(localStorage.getItem('casiano-datos') || '{}')); } catch (e) { /* nada */ }
  const guardar = () => { try { localStorage.setItem('casiano-carrito', JSON.stringify(carrito)); localStorage.setItem('casiano-datos', JSON.stringify(datos)); } catch (e) { /* sin almacenamiento */ } };

  const esKg = (p) => p.unidad === 'kg';
  const paso = (p) => (esKg(p) ? 0.25 : 1);
  const fmtCant = (p, c) => (esKg(p) ? (c < 1 ? `${Math.round(c * 1000)} g` : `${String(c).replace('.', ',')} kg`) : `${c}`);
  const precioTxt = (p) => (esKg(p) ? `${pesos(p.precio)} <small>el kg</small>` : pesos(p.precio));
  const subtotal = () => Object.entries(carrito).reduce((a, [id, c]) => a + Math.round(porId[id].precio * c), 0);
  const cantItems = () => Object.keys(carrito).length;

  let cat = 'Todo', q = '';

  function pintarChips() {
    $('#chips').innerHTML = ['Todo', ...cats].map((c) => `<button class="chip${c === cat ? ' activo' : ''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  }

  function tarjeta(p) {
    const c = carrito[p.id];
    return `<button class="prod${p.hayStock ? '' : ' sin'}" data-id="${esc(p.id)}"${p.hayStock ? '' : ' disabled'}>
      <div class="txt"><div class="nom">${esc(p.nombre)}</div>
        ${p.descripcion ? `<div class="desc">${esc(p.descripcion)}</div>` : ''}
        ${p.hayStock ? (!esKg(p) && tope(p) <= 3 ? `<div class="etq-ult">${tope(p) === 1 ? 'Última unidad' : `Últimas ${tope(p)} unidades`}</div>` : '') : '<div class="etq-sin">Sin stock por ahora</div>'}
        <div class="precio">${precioTxt(p)}</div></div>
      <div class="foto">${p.foto ? `<img src="${esc(p.foto)}" alt="" loading="lazy">` : emoji(p)}
        ${c ? `<span class="cant-badge">${fmtCant(p, c)}</span>` : ''}<span class="mas">+</span></div>
    </button>`;
  }

  function pintarLista() {
    const t = sinAcento(q.trim());
    let lista = prods.filter((p) => (cat === 'Todo' || p.cat === cat) && (!t || t.split(/\s+/).every((w) => p._q.includes(w))));
    lista.sort((a, b) => (b.hayStock - a.hayStock) || a.nombre.localeCompare(b.nombre, 'es'));
    if (!lista.length) { $('#lista').innerHTML = `<p class="vacio">No encontramos "${esc(q)}". Probá con otra palabra o escribinos por WhatsApp.</p>`; return; }
    if (t || cat !== 'Todo') { $('#lista').innerHTML = `<div class="grilla">${lista.map(tarjeta).join('')}</div>`; return; }
    $('#lista').innerHTML = cats.map((c) => {
      const de = lista.filter((p) => p.cat === c);
      return de.length ? `<h2 class="seccion">${esc(c)}</h2><div class="grilla">${de.map(tarjeta).join('')}</div>` : '';
    }).join('');
  }

  function pintarBarra() {
    const n = cantItems();
    $('#barra').hidden = n === 0;
    $('#barraN').textContent = n;
    $('#barraT').textContent = pesos(subtotal());
  }

  const capa = $('#capa');
  function abrir(html) {
    const yaAbierta = !!capa.firstChild, scroll = yaAbierta ? ($('.hoja', capa) || {}).scrollTop || 0 : 0;
    capa.innerHTML = `<div class="velo"><div class="hoja${yaAbierta ? ' quieta' : ''}">${html}</div></div>`;
    if (scroll) $('.hoja', capa).scrollTop = scroll;
    document.body.style.overflow = 'hidden';
  }
  function cerrar() { capa.innerHTML = ''; document.body.style.overflow = ''; }
  capa.addEventListener('click', (e) => { if (e.target.classList.contains('velo') || e.target.closest('.cerrar')) cerrar(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrar(); });

  function verProducto(id) {
    const p = porId[id];
    let c = Math.min(carrito[id] || paso(p), tope(p)), aviso = '';
    const pintar = () => {
      abrir(`<div class="hoja-cab"><h3>${esc(p.nombre)}</h3><button class="cerrar" aria-label="Cerrar">✕</button></div>
        <div class="det-foto">${p.foto ? `<img src="${esc(p.foto)}" alt="">` : emoji(p)}</div>
        <div class="cuerpo">
          ${p.descripcion ? `<p>${esc(p.descripcion)}</p>` : ''}
          <p><b style="color:var(--tinta);font-size:18px">${precioTxt(p)}</b></p>
          ${esKg(p) ? '<p>Se vende suelto: elegí la cantidad de a 250 g.</p>' : ''}
          <div class="stepper"><button data-d="-1" aria-label="Menos">−</button><span>${fmtCant(p, c)}</span><button data-d="1" aria-label="Más">+</button></div>
          ${aviso ? `<div class="error">${esc(aviso)}</div>` : ''}
          <button class="agregar" data-ok><span>${carrito[id] ? 'Actualizar pedido' : 'Agregar al pedido'}</span><span>${pesos(p.precio * c)}</span></button>
          ${carrito[id] ? '<button class="agregar" data-quitar style="background:#f1ede6;color:#a33;justify-content:center">Quitar del pedido</button>' : ''}
        </div>`);
      $('.stepper', capa).addEventListener('click', (e) => {
        const b = e.target.closest('[data-d]'); if (!b) return;
        const n = Math.max(paso(p), Math.round((c + paso(p) * Number(b.dataset.d)) * 100) / 100);
        aviso = n > tope(p) ? `No tenemos más stock: podés pedir hasta ${fmtCant(p, tope(p))}${esKg(p) ? '' : (tope(p) === 1 ? ' unidad' : ' unidades')}.` : '';
        c = Math.min(n, tope(p));
        pintar();
      });
      $('[data-ok]', capa).addEventListener('click', () => { if (!p.hayStock) { delete carrito[id]; } else carrito[id] = Math.min(c, tope(p)); guardar(); cerrar(); refrescar(); });
      const q2 = $('[data-quitar]', capa); if (q2) q2.addEventListener('click', () => { delete carrito[id]; guardar(); cerrar(); refrescar(); });
    };
    pintar();
  }

  function verPedido(error = '') {
    const envio = datos.modo === 'envio' ? Number(N.envio) || 0 : 0;
    const sub = subtotal();
    abrir(`<div class="hoja-cab"><h3>Tu pedido</h3><button class="cerrar" aria-label="Cerrar">✕</button></div>
      <div class="cuerpo">
        ${Object.entries(carrito).map(([id, c]) => { const p = porId[id]; return `<div class="item" data-id="${esc(id)}">
          <div class="t"><b>${esc(p.nombre)}</b><small>${pesos(p.precio * c)}</small></div>
          <div class="stepper"><button data-d="-1">−</button><span>${fmtCant(p, c)}</span><button data-d="1">+</button></div></div>`; }).join('')}
        <div class="opciones">
          ${N.envio > 0 ? `<button class="opcion${datos.modo === 'envio' ? ' activo' : ''}" data-modo="envio"><b>Envío</b><small>${pesos(N.envio)} · en el barrio</small></button>` : ''}
          <button class="opcion${datos.modo === 'retiro' ? ' activo' : ''}" data-modo="retiro"><b>Retiro</b><small>En ${esc(N.direccion || 'el local')} · gratis</small></button>
        </div>
        <label class="campo">Tu nombre<input id="fNombre" value="${esc(datos.nombre)}" autocomplete="name"></label>
        ${datos.modo === 'envio' ? `<label class="campo">Dirección de entrega (calle, número, piso)<input id="fDir" value="${esc(datos.direccion)}" autocomplete="street-address"></label>` : ''}
        <label class="campo">Forma de pago<select id="fPago">${['Efectivo', 'Transferencia', 'Mercado Pago', 'Tarjeta (débito/crédito)'].map((o) => `<option${o === datos.pago ? ' selected' : ''}>${o}</option>`).join('')}</select></label>
        <label class="campo">Aclaraciones (opcional)<textarea id="fNotas" rows="2">${esc(datos.notas)}</textarea></label>
        <div class="totales">
          <div><span>Productos</span><span>${pesos(sub)}</span></div>
          ${datos.modo === 'envio' ? `<div><span>Envío</span><span>${pesos(envio)}</span></div>` : ''}
          <div class="g"><span>Total</span><span>${pesos(sub + envio)}</span></div>
        </div>
        ${error ? `<div class="error">${esc(error)}</div>` : ''}
        <button class="wa" id="enviar"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.3-.5 0-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 .9c.3.1.5.2.5.3.1.2.1.7-.1 1.2z"/></svg>Enviar pedido por WhatsApp</button>
        <p class="nota">Se abre WhatsApp con tu pedido listo para mandar. Te confirmamos por ahí el total y el horario.</p>
      </div>`);
    const leer = () => { datos.nombre = $('#fNombre', capa).value; const d = $('#fDir', capa); if (d) datos.direccion = d.value; datos.pago = $('#fPago', capa).value; datos.notas = $('#fNotas', capa).value; guardar(); };
    capa.querySelectorAll('.item .stepper').forEach((s) => s.addEventListener('click', (e) => {
      const b = e.target.closest('[data-d]'); if (!b) return;
      leer();
      const id = s.closest('.item').dataset.id, p = porId[id];
      const c = Math.round((carrito[id] + paso(p) * Number(b.dataset.d)) * 100) / 100;
      let msg = '';
      if (c <= 0) delete carrito[id]; else { if (c > tope(p)) msg = `De ${p.nombre} podés pedir hasta ${fmtCant(p, tope(p))}.`; carrito[id] = Math.min(c, tope(p)); }
      guardar(); refrescar();
      if (cantItems()) verPedido(msg); else cerrar();
    }));
    capa.querySelectorAll('[data-modo]').forEach((b) => b.addEventListener('click', () => { leer(); datos.modo = b.dataset.modo; guardar(); verPedido(); }));
    $('#enviar', capa).addEventListener('click', () => {
      leer();
      if (!datos.nombre.trim()) return verPedido('Poné tu nombre así sabemos de quién es el pedido.');
      if (datos.modo === 'envio' && !datos.direccion.trim()) return verPedido('Poné la dirección de entrega.');
      const lineas = Object.entries(carrito).map(([id, c]) => { const p = porId[id]; return `• ${fmtCant(p, c)}${esKg(p) ? '' : ' x'} ${p.nombre} — ${pesos(p.precio * c)}`; });
      const txt = [`Hola Casiano! Quiero hacer este pedido:`, '', ...lineas, '',
        `Productos: ${pesos(sub)}`,
        datos.modo === 'envio' ? `Envío: ${pesos(envio)}` : 'Retiro en el local',
        `*Total: ${pesos(sub + envio)}*`, '',
        `Nombre: ${datos.nombre.trim()}`,
        datos.modo === 'envio' ? `Dirección: ${datos.direccion.trim()}` : null,
        `Pago: ${datos.pago}`,
        datos.notas.trim() ? `Aclaraciones: ${datos.notas.trim()}` : null].filter((l) => l !== null).join('\n');
      window.open(`https://wa.me/${N.whatsapp}?text=${encodeURIComponent(txt)}`, '_blank');
      verPedido();
    });
  }

  function verContacto() {
    abrir(`<div class="hoja-cab"><h3>${esc(N.nombre)}</h3><button class="cerrar" aria-label="Cerrar">✕</button></div>
      <div class="cuerpo contacto">
        <p><b style="color:var(--tinta)">Dirección</b><br>${esc(N.direccion)}, ${esc(N.ciudad)} · <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${N.direccion}, ${N.ciudad}, Santa Fe`)}" target="_blank" rel="noopener">Ver en el mapa</a></p>
        <p><b style="color:var(--tinta)">WhatsApp</b><br><a href="https://wa.me/${N.whatsapp}" target="_blank" rel="noopener">Escribinos</a></p>
        <p><b style="color:var(--tinta)">Horarios</b><br>${esc(N.horarios || 'A confirmar')}</p>
        ${N.envio > 0 ? `<p><b style="color:var(--tinta)">Envíos</b><br>En el barrio, ${pesos(N.envio)}.</p>` : ''}
      </div>`);
  }

  function refrescar() { pintarChips(); pintarLista(); pintarBarra(); }

  $('#chips').addEventListener('click', (e) => { const b = e.target.closest('[data-cat]'); if (!b) return; cat = b.dataset.cat; refrescar(); window.scrollTo({ top: $('.chips').offsetTop, behavior: 'smooth' }); });
  $('#q').addEventListener('input', (e) => { q = e.target.value; if (q) cat = 'Todo'; pintarChips(); pintarLista(); });
  $('#lista').addEventListener('click', (e) => { const b = e.target.closest('.prod'); if (b && !b.disabled) verProducto(b.dataset.id); });
  $('#verPedido').addEventListener('click', () => verPedido());
  $('#btnInfo').addEventListener('click', verContacto);

  $('#aviso').innerHTML = `${N.envio > 0 ? `🛵 Envíos en el barrio ${pesos(N.envio)} · ` : ''}🏪 Retiro gratis en ${esc(N.direccion)}`;
  if (C.actualizado) $('#pie').textContent = `Precios actualizados el ${C.actualizado}. Pueden variar; te confirmamos el total por WhatsApp.`;
  if (!prods.length) $('#lista').innerHTML = '<p class="vacio">Estamos cargando los productos. Volvé en un rato o escribinos por WhatsApp.</p>';
  refrescar();

  // Cada 2 minutos (y al volver a la pestaña) se actualizan precios y stock sin recargar la página.
  function actualizarStock() {
    cargarCatalogo(() => {
      const nuevo = window.CATALOGO; if (!nuevo || !nuevo.productos) return;
      const cambiados = [];
      nuevo.productos.forEach((np) => {
        const p = porId[np.id]; if (!p) return;
        if (p.hayStock !== np.hayStock || p.max !== np.max || p.precio !== np.precio) { cambiados.push(p.id); Object.assign(p, { hayStock: np.hayStock, max: np.max, precio: np.precio }); }
      });
      if (!cambiados.length) return;
      Object.keys(carrito).forEach((id) => { const p = porId[id]; if (!p.hayStock) delete carrito[id]; else carrito[id] = Math.min(carrito[id], tope(p)); });
      guardar();
      // Solo se reemplazan las tarjetas que cambiaron: la lista no se reordena ni se mueve el scroll.
      cambiados.forEach((id) => {
        document.querySelectorAll(`.prod[data-id="${CSS.escape(id)}"]`).forEach((el) => {
          const t = document.createElement('div'); t.innerHTML = tarjeta(porId[id]).trim(); el.replaceWith(t.firstChild);
        });
      });
      pintarBarra();
    });
  }
  setInterval(actualizarStock, 2 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) actualizarStock(); });
});
</script>
</body>
</html>
